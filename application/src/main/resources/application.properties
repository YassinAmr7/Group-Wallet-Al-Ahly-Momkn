spring.application.name=applicationService


-- mysql
spring.datasource.url=jdbc:mysql://localhost:3306/GroupWallet?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=tiger
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=always



# Datasource Configuration (SQL Server)
#spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=GroupWallet;encrypt=true;trustServerCertificate=true;
#spring.datasource.username=hr-user
